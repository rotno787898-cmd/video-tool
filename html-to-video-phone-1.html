<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → Video (MP4)</title>
<style>
  :root{--bg:#0f1221;--card:#1a1f38;--ac:#4cc9f0;--tx:#e8ecff;--mut:#8f98c4;--ln:#2c3463}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:14px;max-width:820px;margin-inline:auto}
  h1{font-size:19px;margin:6px 0 12px}
  .card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
  #stage{position:relative;background:#000;border-radius:10px;overflow:hidden;margin:0 auto}
  #pv{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  select,input[type=number],textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font-size:15px}
  textarea{height:200px;font-family:monospace;font-size:12px}
  button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#04121c;font-weight:700;font-size:15px;margin-top:10px}
  button.sec{background:var(--ln);color:var(--tx);margin-top:0}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:10px}
  #fill{height:100%;width:0;background:var(--ac)}
  #st{font-size:13px;color:var(--mut);margin-top:8px;white-space:pre-line}
  video{width:100%;border-radius:10px;background:#000;display:block}
  details summary{cursor:pointer;color:var(--ac);font-size:14px;margin-top:10px}
  .hide{display:none}
  #clock{font-size:13px;color:var(--mut);white-space:nowrap}
</style>
</head>
<body>
<h1>🎬 HTML → ভিডিও (MP4, 4K, ফ্রেমরেট সেটিংস সহ)</h1>

<div class="card">
  <div id="stage"><iframe id="pv" sandbox="allow-scripts allow-same-origin"></iframe></div>
  <div class="row"><button class="sec" id="restart" style="width:auto;padding:10px 16px">⟲ রিস্টার্ট</button><span id="clock">0.0s</span></div>
</div>

<div class="card">
  <label>HTML কোড (যেকোনো AI থেকে বানিয়ে এখানে পেস্ট করুন)</label>
  <textarea id="src" spellcheck="false"></textarea>
  <div class="row3">
    <button class="sec" id="upl">📂 ফাইল</button>
    <button class="sec" id="sample">নমুনা</button>
    <button class="sec" id="clear">মুছুন</button>
  </div>
  <input type="file" id="file" accept=".html,.htm,text/html" hidden>
  <button id="load">👁 প্রিভিউ দেখুন</button>
  <details>
    <summary>🤖 AI-কে দেওয়ার প্রম্পট (কপি করে যেকোনো AI-তে দিন)</summary>
    <textarea id="aiPrompt" readonly style="height:260px"></textarea>
    <button class="sec" id="copyPrompt" style="margin-top:8px">প্রম্পট কপি করুন</button>
  </details>
</div>

<div class="card">
  <div class="grid2">
    <div><label>সাইজ / রেজোলিউশন</label>
      <select id="fmt">
        <option value="3840,2160">ল্যান্ডস্কেপ 4K 3840×2160</option>
        <option value="2560,1440">ল্যান্ডস্কেপ 1440p</option>
        <option value="1920,1080">ল্যান্ডস্কেপ Full HD</option>
        <option value="1280,720">ল্যান্ডস্কেপ 720p</option>
        <option value="2160,3840">ভার্টিকাল 4K 2160×3840</option>
        <option value="1080,1920">ভার্টিকাল Full HD</option>
        <option value="2160,2160">স্কয়ার 2160×2160</option>
        <option value="1080,1080">স্কয়ার 1080×1080</option>
      </select></div>
    <div><label>ফ্রেমরেট (fps)</label>
      <select id="fps"><option>24</option><option>25</option><option selected>30</option><option>60</option></select></div>
    <div><label>সময় (সেকেন্ড)</label><input type="number" id="dur" value="10" min="1" max="60"></div>
    <div><label>কোয়ালিটি</label>
      <select id="q"><option value="0.10">স্ট্যান্ডার্ড</option><option value="0.16" selected>হাই</option><option value="0.25">ম্যাক্স</option></select></div>
  </div>
  <button id="go">⬇ MP4 এক্সপোর্ট করুন</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="st">প্রস্তুত। এক্সপোর্টের সময় স্ক্রিন অন রাখুন এবং এই ট্যাব থেকে বের হবেন না। (Chrome ব্যবহার করুন)</div>
</div>

<div class="card hide" id="out">
  <video id="vid" controls loop playsinline></video>
  <button id="dl">⬇ ডাউনলোড (MP4)</button>
  <button id="share" class="sec" style="margin-top:8px;width:100%;padding:13px">📱 গ্যালারিতে সেভ / শেয়ার</button>
</div>

<script>
const VCLOCK = "/* Virtual clock: makes any HTML animation deterministic, frame by frame.\n   Injected BEFORE the page's own scripts (both in the phone tool and in render-html.js). */\n(function () {\n  var now = 0, tid = 1, rid = 1, timers = [], rafs = [], seed = 1234567;\n  var base = 1767225600000, D = Date;\n  Math.random = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };\n  performance.now = function () { return now; };\n  window.Date = class VDate extends D {\n    constructor(...a) { if (a.length === 0) super(base + now); else super(...a); }\n    static now() { return base + now; }\n  };\n  window.setTimeout = function (f, ms) {\n    var a = [].slice.call(arguments, 2), id = tid++;\n    timers.push({ id: id, due: now + (+ms || 0), f: f, a: a, iv: 0 }); return id;\n  };\n  window.setInterval = function (f, ms) {\n    var a = [].slice.call(arguments, 2), id = tid++, iv = Math.max(+ms || 0, 1);\n    timers.push({ id: id, due: now + iv, f: f, a: a, iv: iv }); return id;\n  };\n  window.clearTimeout = window.clearInterval = function (id) { timers = timers.filter(function (t) { return t.id !== id; }); };\n  window.requestAnimationFrame = function (f) { var id = rid++; rafs.push({ id: id, f: f }); return id; };\n  window.cancelAnimationFrame = function (id) { rafs = rafs.filter(function (r) { return r.id !== id; }); };\n  window.__vcAdvance = function (t) {            // t in milliseconds\n    now = t;\n    var guard = 0;\n    while (guard++ < 10000) {\n      var due = timers.filter(function (x) { return x.due <= now; }).sort(function (a, b) { return a.due - b.due; })[0];\n      if (!due) break;\n      if (due.iv) due.due += due.iv; else timers = timers.filter(function (x) { return x !== due; });\n      try { due.f.apply(window, due.a); } catch (e) { console.error(e); }\n    }\n    var list = rafs; rafs = [];\n    list.forEach(function (r) { try { r.f(now); } catch (e) { console.error(e); } });\n    try { document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = now; }); } catch (e) {}\n  };\n})();\n";
const $ = id => document.getElementById(id);
const setStatus = s => { $('st').textContent = s; };

/* ---------- Prompt for any AI ---------- */
$('aiPrompt').value = `Create ONE self-contained HTML file for a seamless looping animation that will be rendered to a 10-second video (3840x2160, 30fps).

RULES (follow strictly):
1. Design on a 1920x1080 stage. Use: html,body{margin:0;width:100%;height:100%;overflow:hidden}. Fill the whole screen.
2. The loop is exactly 10 seconds and the last frame must flow seamlessly into the first.
3. Animate ONLY with CSS @keyframes (animation-duration 10s, 5s, 2s or 1s, iteration-count: infinite, linear or ease-in-out) OR with requestAnimationFrame(ts) where all motion is a pure function of ts (e.g. phase = (ts % 10000) / 10000 * 2π, and use integer multiples of the phase so it loops). Never use video, audio, user input or real clocks.
4. No SMIL (<animate>), no external files, images or web fonts. Inline everything and use system fonts. Inline SVG, CSS shapes and <canvas> are fine.
5. Style: clean flat vector graphics (EPS / Adobe Stock style), smooth gradients, no photos, no logos, no copyrighted characters, no text unless I ask.
6. No buttons, controls or UI. Output only the HTML code, nothing else.

THEME: [describe your idea here, e.g. "calm night sky with drifting clouds and twinkling stars, blue and purple palette"]`;
$('copyPrompt').onclick = async () => {
  try { await navigator.clipboard.writeText($('aiPrompt').value); setStatus('✅ প্রম্পট কপি হয়েছে। THEME অংশে আপনার আইডিয়া লিখে AI-কে দিন।'); }
  catch (e) { $('aiPrompt').select(); setStatus('লেখাটি সিলেক্ট হয়েছে, এখন "কপি" চাপুন।'); }
};

/* ---------- Sample ---------- */
const SAMPLE = `<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#0f1b4d,#5b2a86 60%,#e0457b)}
.sun{position:absolute;left:50%;top:58%;width:420px;height:420px;margin:-210px;border-radius:50%;background:#ffd166;animation:pulse 10s ease-in-out infinite}
.ring{position:absolute;left:50%;top:58%;border-radius:50%;border:6px solid rgba(255,209,102,.6);animation:ring 10s linear infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ring{from{width:420px;height:420px;margin:-210px;opacity:.8}to{width:1500px;height:1500px;margin:-750px;opacity:0}}
.hill{position:absolute;bottom:-60px;left:-10%;width:120%;border-radius:50% 50% 0 0}
.h1{height:360px;background:#2b1b57;animation:sway 10s ease-in-out infinite}
.h2{height:250px;background:#170f35;animation:sway 10s ease-in-out infinite reverse}
@keyframes sway{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
.star{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
</style></head><body>
<div class="ring"></div><div class="ring" style="animation-delay:-3.33s"></div><div class="ring" style="animation-delay:-6.66s"></div>
<div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div>
<script>
for(let i=0;i<70;i++){const s=document.createElement('div');s.className='star';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*55+'%';s.style.animationDelay=-(Math.random()*2)+'s';document.body.appendChild(s);}
<\/script></body></html>`;
$('src').value = SAMPLE;
$('sample').onclick = () => { $('src').value = SAMPLE; loadPreview(); };
$('clear').onclick = () => { $('src').value = ''; };
$('upl').onclick = () => $('file').click();
$('file').onchange = async e => { const f = e.target.files[0]; if (f) { $('src').value = await f.text(); loadPreview(); } };

/* ---------- Resource inlining (images, fonts, stylesheets from the web) ---------- */
async function toDataUrl(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(r.status);
  const b = await r.blob();
  return new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); });
}
async function inlineCssUrls(css, baseUrl, warn) {
  const re = /url\(\s*(['"]?)([^)'"]+)\1\s*\)/g; const jobs = [];
  css.replace(re, (m, q, u) => { if (!/^data:|^#/.test(u)) jobs.push(u); return m; });
  const map = {};
  await Promise.all([...new Set(jobs)].map(async u => {
    try { map[u] = await toDataUrl(new URL(u, baseUrl).href); } catch (e) { warn.push(u); }
  }));
  return css.replace(re, (m, q, u) => map[u] ? `url("${map[u]}")` : m);
}
async function prepareHtml(src) {
  const warn = [];
  const d = new DOMParser().parseFromString(src, 'text/html');
  for (const l of [...d.querySelectorAll('link[rel~="stylesheet"][href]')]) {
    const href = l.getAttribute('href'); if (!/^https?:/.test(href)) continue;
    try {
      const r = await fetch(href); const css = await inlineCssUrls(await r.text(), href, warn);
      const s = d.createElement('style'); s.textContent = css; l.replaceWith(s);
    } catch (e) { warn.push(href); }
  }
  for (const s of [...d.querySelectorAll('style')]) s.textContent = await inlineCssUrls(s.textContent, location.href, warn);
  for (const im of [...d.querySelectorAll('img[src]')]) {
    const u = im.getAttribute('src'); if (!/^https?:/.test(u)) continue;
    try { im.setAttribute('src', await toDataUrl(u)); } catch (e) { warn.push(u); }
  }
  const clk = d.createElement('script'); clk.textContent = VCLOCK; d.head.prepend(clk);
  return { html: '<!DOCTYPE html>' + d.documentElement.outerHTML, warn };
}

/* ---------- Format helpers ---------- */
function fmt() {
  const [W, H] = $('fmt').value.split(',').map(Number);
  const k = 1080 / Math.min(W, H);
  return { W, H, lw: Math.round(W * k), lh: Math.round(H * k) };
}

/* ---------- Live preview ---------- */
const pv = $('pv'), stage = $('stage');
let prepared = null, t0 = 0, busy = false;
function layoutPreview() {
  const { lw, lh } = fmt();
  const maxW = Math.min(stage.parentElement.clientWidth - 24, innerHeight * 0.6 * lw / lh);
  stage.style.width = maxW + 'px'; stage.style.height = (maxW * lh / lw) + 'px';
  pv.style.width = lw + 'px'; pv.style.height = lh + 'px';
  pv.style.transform = `scale(${maxW / lw})`;
}
addEventListener('resize', layoutPreview); $('fmt').onchange = layoutPreview;

async function loadPreview() {
  if (busy) return;
  setStatus('⏳ রিসোর্স প্রস্তুত হচ্ছে...');
  const { html, warn } = await prepareHtml($('src').value);
  prepared = html; layoutPreview();
  await new Promise(r => { pv.onload = r; pv.srcdoc = html; });
  t0 = performance.now();
  setStatus(warn.length ? `⚠ ${warn.length}টি বাইরের ফাইল লোড হয়নি (যেমন ${warn[0].slice(0, 60)}...). AI-কে বলুন সব ইনলাইন করতে।` : '✅ প্রিভিউ চলছে। ঠিক থাকলে MP4 এক্সপোর্ট করুন।');
}
$('load').onclick = loadPreview;
$('restart').onclick = loadPreview;
(function tick() {
  if (!busy && prepared) {
    try { pv.contentWindow.__vcAdvance(performance.now() - t0); } catch (e) {}
    $('clock').textContent = (((performance.now() - t0) / 1000) % (+$('dur').value || 10)).toFixed(1) + 's';
  }
  requestAnimationFrame(tick);
})();
layoutPreview(); loadPreview();

/* ---------- Frame capture: live DOM → SVG foreignObject → canvas ---------- */
async function capture(doc, win, ctx, W, H, lw, lh) {
  const live = [...doc.documentElement.querySelectorAll('*')];
  const root = doc.documentElement.cloneNode(true);
  const cl = [...root.querySelectorAll('*')];
  const targets = new Set();
  doc.getAnimations().forEach(a => { const e = a.effect; if (e && e.target && !e.pseudoElement) targets.add(e.target); });
  const swaps = [];
  for (let i = 0; i < live.length; i++) {
    const el = live[i], c = cl[i];
    if (el.tagName === 'CANVAS') {
      let url; try { url = el.toDataURL('image/png'); } catch (e) { continue; }
      const im = doc.createElement('img'); im.setAttribute('src', url);
      if (el.id) im.id = el.id; if (el.className) im.className = el.className;
      im.setAttribute('style', (el.getAttribute('style') || '') + `;width:${el.clientWidth}px;height:${el.clientHeight}px`);
      swaps.push([c, im]);
    } else if (targets.has(el)) {
      const cs = win.getComputedStyle(el); let s = '';
      for (const p of cs) s += p + ':' + cs.getPropertyValue(p) + ';';
      c.setAttribute('style', s + 'animation:none !important;transition:none !important;');
    }
  }
  swaps.forEach(([c, im]) => c.replaceWith(im));
  root.querySelectorAll('script,noscript').forEach(n => n.remove());
  root.style.width = lw + 'px'; root.style.height = lh + 'px'; root.style.overflow = 'hidden';
  const xml = new XMLSerializer().serializeToString(root);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${lw}" height="${lh}"><foreignObject x="0" y="0" width="${lw}" height="${lh}">${xml}</foreignObject></svg>`;
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);   // data: URL keeps the canvas untainted
  await img.decode();
  const opaque = c => c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent';
  const hb = win.getComputedStyle(doc.documentElement).backgroundColor, bb = win.getComputedStyle(doc.body).backgroundColor;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = opaque(hb) ? hb : opaque(bb) ? bb : '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
}

/* ---------- Encoder ---------- */
async function pickConfig(W, H, fps, bpp) {
  const codecs = ['avc1.640034', 'avc1.640033', 'avc1.640032', 'avc1.64002A', 'avc1.640028', 'avc1.4d0028', 'avc1.42001f'];
  const bitrate = Math.min(120e6, Math.round(W * H * fps * bpp));
  for (const codec of codecs) {
    const cfg = { codec, width: W, height: H, bitrate, framerate: fps };
    try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) return cfg; } catch (e) {}
  }
  return null;
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function ensureMuxer() {
  if (typeof Mp4Muxer !== 'undefined') return true;
  for (const u of ['https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js', 'https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.js']) {
    try { await loadScript(u); if (typeof Mp4Muxer !== 'undefined') return true; } catch (e) {}
  }
  return false;
}

/* ---------- Export ---------- */
let blobUrl = null, blob = null, outName = 'video.mp4';
$('go').onclick = async () => {
  if (busy) return;
  if (!('VideoEncoder' in window)) { setStatus('এই ব্রাউজারে ভিডিও এনকোডার নেই। Android/PC-তে Chrome ব্যবহার করুন।'); return; }
  if (!(await ensureMuxer())) { setStatus('ইন্টারনেট দরকার (mp4-muxer লোড হয়নি)। নেট চালু করে আবার চেষ্টা করুন।'); return; }
  busy = true; $('go').disabled = true; $('out').classList.add('hide');
  let wake = null; try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  let ex = null;
  try {
    const fps = +$('fps').value, dur = Math.max(1, Math.min(60, +$('dur').value || 10)), bpp = +$('q').value;
    let { W, H, lw, lh } = fmt();
    let cfg = await pickConfig(W, H, fps, bpp), note = '';
    if (!cfg) for (const k of [2 / 3, 1 / 2]) {
      const w2 = Math.round(W * k / 2) * 2, h2 = Math.round(H * k / 2) * 2;
      cfg = await pickConfig(w2, h2, fps, bpp);
      if (cfg) { W = w2; H = h2; note = `⚠ ডিভাইস বড় সাইজ সাপোর্ট করেনি, ${W}×${H} এ হচ্ছে।\n`; break; }
    }
    if (!cfg) throw new Error('এই ডিভাইসে H.264 এনকোডার পাওয়া যায়নি। কম্পিউটার ভার্সন ব্যবহার করুন।');

    setStatus('⏳ রিসোর্স প্রস্তুত হচ্ছে...');
    const { html } = await prepareHtml($('src').value);
    ex = document.createElement('iframe');
    ex.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    ex.style.cssText = `position:fixed;left:0;top:0;width:${lw}px;height:${lh}px;border:0;opacity:0.01;pointer-events:none;z-index:-1`;
    document.body.appendChild(ex);
    await new Promise(r => { ex.onload = r; ex.srcdoc = html; });
    const win = ex.contentWindow, doc = ex.contentDocument;
    try { await doc.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 400));

    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width: W, height: H, frameRate: fps },
      fastStart: 'in-memory'
    });
    let encErr = null;
    const enc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: e => { encErr = e; } });
    enc.configure(cfg);

    const N = dur * fps, tStart = performance.now();
    for (let i = 0; i < N; i++) {
      if (encErr) throw encErr;
      win.__vcAdvance(i * 1000 / fps);
      await capture(doc, win, ctx, W, H, lw, lh);
      const fr = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(fr, { keyFrame: i % fps === 0 });
      fr.close();
      while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 5));
      if (i % 2 === 0) {
        $('fill').style.width = (i / N * 100).toFixed(1) + '%';
        const el = (performance.now() - tStart) / 1000, eta = el / (i + 1) * (N - i - 1);
        setStatus(`${note}ফ্রেম ${i + 1}/${N} • ${W}×${H} • বাকি ≈ ${Math.ceil(eta)} সেকেন্ড`);
        await new Promise(r => setTimeout(r));
      }
    }
    await enc.flush(); enc.close(); muxer.finalize();
    blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    outName = `html-video_${W}x${H}_${fps}fps_${dur}s.mp4`;
    $('vid').src = blobUrl; $('out').classList.remove('hide'); $('fill').style.width = '100%';
    setStatus(`${note}✅ সম্পন্ন! ${W}×${H}, ${fps}fps, ${dur}s, ${(blob.size / 1048576).toFixed(1)} MB`);
  } catch (e) {
    setStatus('ত্রুটি: ' + (e.message || e) + '\n(HTML-এ বাইরের ফাইল/SMIL থাকলে AI-কে প্রম্পটের নিয়ম মেনে আবার বানাতে বলুন।)');
  }
  if (ex) ex.remove();
  if (wake) try { wake.release(); } catch (e) {}
  busy = false; $('go').disabled = false; t0 = performance.now(); loadPreview();
};

$('dl').onclick = () => { const a = document.createElement('a'); a.href = blobUrl; a.download = outName; a.click(); };
$('share').onclick = async () => {
  const f = new File([blob], outName, { type: 'video/mp4' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) {} }
  else setStatus('শেয়ার সাপোর্ট নেই। "ডাউনলোড" চাপুন, ফাইল Downloads ফোল্ডারে যাবে।');
};
</script>
